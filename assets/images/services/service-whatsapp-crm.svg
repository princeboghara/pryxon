<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="waBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1215"/>
      <stop offset="100%" stop-color="#0d211a"/>
    </linearGradient>
    <linearGradient id="waGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25d366"/>
      <stop offset="100%" stop-color="#128c7e"/>
    </linearGradient>
    <linearGradient id="bubbleClient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bubbleBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#054640"/>
      <stop offset="100%" stop-color="#0b5e54"/>
    </linearGradient>
  </defs>

  <!-- Canvas Frame -->
  <rect x="15" y="15" width="370" height="190" rx="14" fill="url(#waBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- WhatsApp Top Header Bar -->
  <path d="M15 15 h370 r14 0 v32 h-370 v-32 r0 -14" fill="#07332d"/>
  <!-- Avatar with online indicator -->
  <circle cx="34" cy="31" r="10" fill="#128c7e"/>
  <text x="34" y="34.5" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">P</text>
  <circle cx="42" cy="38" r="3" fill="#25d366" stroke="#07332d" stroke-width="1"/>

  <!-- Account Name & Verified Mark -->
  <text x="52" y="28" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#f8fafc">Pryxon Smart CRM</text>
  <circle cx="128" cy="25" r="4" fill="#25d366"/>
  <path d="M126 25 l1.5 1.5 l3 -3" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
  <text x="52" y="38" font-family="system-ui, sans-serif" font-size="7" fill="#86efac">⚡ Automated Lead Bot • Online</text>

  <!-- Top Right CRM Status Badge -->
  <rect x="260" y="21" width="112" height="20" rx="10" fill="rgba(37, 211, 102, 0.15)" stroke="#25d366" stroke-width="0.8"/>
  <circle cx="272" cy="31" r="3" fill="#25d366"/>
  <text x="320" y="34" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" fill="#25d366" text-anchor="middle">🔥 HIGH PRIORITY LEAD</text>

  <!-- Left: Chat UI Stream -->
  <g transform="translate(25, 56)">
    <!-- Timestamp Divider -->
    <rect x="85" y="0" width="70" height="12" rx="6" fill="#111827"/>
    <text x="120" y="8.5" font-family="system-ui, sans-serif" font-size="6" fill="#94a3b8" text-anchor="middle">TODAY • 10:42 AM</text>

    <!-- Client Incoming Message (Right-aligned in mini bubble or Left) -->
    <rect x="0" y="16" width="180" height="28" rx="8" fill="url(#bubbleClient)" stroke="#334155" stroke-width="0.8"/>
    <text x="10" y="29" font-family="system-ui, sans-serif" font-size="7.5" fill="#f8fafc">Interested in custom web &amp; mobile app</text>
    <text x="10" y="39" font-family="system-ui, sans-serif" font-size="6" fill="#64748b">10:42 AM</text>

    <!-- Bot Instant Reply (Auto response in 0.1s) -->
    <rect x="25" y="48" width="200" height="42" rx="8" fill="url(#bubbleBot)" stroke="#128c7e" stroke-width="0.8"/>
    <text x="35" y="61" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#f8fafc">Hi John! 🎉 Welcome to Pryxon Studio.</text>
    <text x="35" y="72" font-family="system-ui, sans-serif" font-size="7.2" fill="#d1fae5">Your customized quote &amp; demo are ready!</text>
    <text x="35" y="84" font-family="system-ui, sans-serif" font-size="6" fill="#86efac">⚡ AI Reply • 0.2s response time</text>

    <!-- WhatsApp Action Button Pills -->
    <rect x="25" y="94" width="95" height="18" rx="9" fill="#075e54" stroke="#25d366" stroke-width="0.8"/>
    <text x="72" y="106" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#ffffff" text-anchor="middle">📄 View Proposal</text>

    <rect x="125" y="94" width="100" height="18" rx="9" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <text x="175" y="106" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#f8fafc" text-anchor="middle">📅 Book Free Call</text>
  </g>

  <!-- Right: CRM Funnel & Analytics Metrics -->
  <g transform="translate(262, 56)">
    <!-- Card 1: Leads Generated -->
    <rect x="0" y="0" width="112" height="60" rx="9" fill="#111827" stroke="#334155" stroke-width="1.2"/>
    <text x="10" y="16" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#94a3b8">QUALIFIED LEADS</text>
    <text x="10" y="38" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#25d366">2,480+</text>
    <text x="10" y="51" font-family="system-ui, sans-serif" font-size="6.5" fill="#38bdf8">↑ 3.8x faster sales close</text>

    <!-- Card 2: Conversion Boost -->
    <rect x="0" y="66" width="112" height="66" rx="9" fill="#111827" stroke="#334155" stroke-width="1.2"/>
    <text x="10" y="82" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#94a3b8">LEAD CONVERSION</text>
    <!-- Visual Progress bar -->
    <rect x="10" y="92" width="92" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="10" y="92" width="76" height="7" rx="3.5" fill="url(#waGreen)"/>
    <text x="10" y="114" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#f8fafc">82.4%</text>
    <text x="50" y="114" font-family="system-ui, sans-serif" font-size="6.5" fill="#10b981">Auto-Synced to CRM</text>
    <text x="10" y="125" font-family="system-ui, sans-serif" font-size="6" fill="#64748b">Hubspot / Zoho / Sheets</text>
  </g>
</svg>