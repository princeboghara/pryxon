  <!-- Performance Gauge Ring -->
  <circle cx="327" cy="154" r="22" fill="none" stroke="#334155" stroke-width="4.5"/>
  <circle cx="327" cy="154" r="22" fill="none" stroke="url(#blueGlow)" stroke-width="4.5" stroke-dasharray="105 138" stroke-linecap="round" transform="rotate(-90 327 154)"/>
