  <rect x="34" y="134" width="30" height="6" rx="3" fill="#334155"/>
  
  <!-- Main Dashboard Content -->
  <!-- Top Stat Cards -->
  <rect x="95" y="55" width="85" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="105" y="65" width="36" height="5" rx="2.5" fill="#64748b"/>
  <rect x="105" y="75" width="55" height="10" rx="3" fill="#f8fafc"/>
  <circle cx="165" cy="75" r="8" fill="rgba(14, 165, 233, 0.2)"/>
  <path d="M162 76 l3 -3 l3 3" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

  <rect x="190" y="55" width="85" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="200" y="65" width="40" height="5" rx="2.5" fill="#64748b"/>
  <rect x="200" y="75" width="50" height="10" rx="3" fill="#38bdf8"/>

  <rect x="285" y="55" width="85" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="295" y="65" width="35" height="5" rx="2.5" fill="#64748b"/>
  <rect x="295" y="75" width="45" height="10" rx="3" fill="#10b981"/>

  <!-- Analytics Graph Area -->
  <rect x="95" y="108" width="180" height="85" rx="8" fill="#17223b" stroke="#334155" stroke-width="1"/>
  <rect x="108" y="118" width="55" height="5" rx="2.5" fill="#94a3b8"/>
  <!-- Graph Grid Lines -->
  <line x1="108" y1="138" x2="262" y2="138" stroke="#334155" stroke-width="0.8" stroke-dasharray="3 3"/>
