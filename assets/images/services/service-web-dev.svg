  <circle cx="36" cy="29" r="4.5" fill="#ef4444"/>
  <circle cx="52" cy="29" r="4.5" fill="#f59e0b"/>
  <circle cx="68" cy="29" r="4.5" fill="#10b981"/>
  
  <!-- Address bar -->
  <rect x="92" y="22" width="216" height="14" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="104" cy="29" r="2.5" fill="#38bdf8"/>
  <rect x="114" y="27" width="95" height="4" rx="2" fill="#94a3b8"/>
  <rect x="330" y="24" width="38" height="10" rx="5" fill="url(#blueGlow)"/>

  <!-- Left Sidebar Navigation -->
